name: Cloud Emulator

on:
  workflow_dispatch:
    schedule:
      - cron: "0 */5 * * *"

concurrency:
  group: vps-android-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark booting (reset android-link.txt, avoid stale link)
        run: |
          git config user.email "fcp@freecloudphone.com"
          git config user.name "FREE CLOUD PHONE"
          {
            echo 'STATUS: booting'
            echo "Run   : $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          } > android-link.txt
          git add android-link.txt
          git commit -m "Android booting..." --allow-empty
          git push origin main --force-with-lease || git push origin main

      - name: Enable KVM (fix Droid logo freeze)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          sudo chown root:kvm /dev/kvm || true
          sudo usermod -aG kvm $USER || true
          ls -la /dev/kvm
          echo "KVM check:"; ls -lh /dev/kvm; egrep -c '(vmx|svm)' /proc/cpuinfo || echo "no vmx/svm"
          # Free memory for emulator
          free -h; df -h

      - name: Pull Android emulator image (max config)
        run: |
          # budtmo/docker-android: x86_64 AOSP 14 + noVNC + adb, KVM accelerated
          docker pull budtmo/docker-android:emulator_14.0

      - name: Start Android (Pixel 8, API 34, 4GB RAM, 4 cores) — fix create
        run: |
          docker rm -f android 2>/dev/null || true
          docker run -d --name android             --device /dev/kvm             --privileged             --shm-size=2g             -p 6080:6080             -p 5554:5554 -p 5555:5555             -e EMULATOR_DEVICE="Pixel 8"             -e EMULATOR_PLATFORM_VERSION=14.0             -e WEB_VNC=true             -e EMULATOR_NO_SKIN=true             -e SCREEN_WIDTH=1080             -e SCREEN_HEIGHT=2400             -e SCREEN_DEPTH=24             -e EMULATOR_ARGS="-no-audio -no-boot-anim -no-metrics -memory 4096 -cores 4 -no-snapshot"             -e WEB_LOG=true             budtmo/docker-android:emulator_14.0
          echo "Container started, waiting for emulator boot..."
          sleep 25
          docker exec android sh -c 'ls -l /dev/kvm; test -r /dev/kvm && echo KVM_OK || echo KVM_MISSING' 2>/dev/null || true
          docker exec android sh -c 'echo "=== docker-android logs ==="; find /home/androidusr /opt -name "*.log" -mmin -10 2>/dev/null | while read f; do echo "### $f"; tail -n 25 "$f"; done' 2>/dev/null || true
          docker exec android supervisorctl status 2>/dev/null || echo "supervisord not responding"
          docker exec android ps aux 2>/dev/null | grep -E 'qemu|emulator' | head -n 3 || true
          docker exec android adb devices || true
          docker logs android --tail 40 || true
          docker ps -a

      - name: Wait for Android boot (with Droid freeze recovery)
        run: |
          set -e
          RESTARTED=0
          for i in $(seq 1 90); do
            STATUS=$(docker exec android adb shell getprop sys.boot_completed 2>/dev/null || echo "0")
            BOOTANIM=$(docker exec android adb shell getprop init.svc.bootanim 2>/dev/null || echo "running")
            HAS_QEMU=$(docker exec android sh -c 'pgrep -f qemu-system >/dev/null && echo QEMU_YES || echo QEMU_NO' 2>/dev/null || echo QEMU_NO)
            echo "⏳ Check $i/90 — boot=$STATUS anim=$BOOTANIM $HAS_QEMU"
            # Droid logo freeze recovery: diagnose then recover adb
            if [ "$i" -eq 30 ] && [ "$STATUS" != "1" ]; then
              echo "⚠️ Slow boot at 5min — diagnosing..."
              docker exec android sh -c 'ls -l /dev/kvm; test -r /dev/kvm && echo KVM_OK || echo KVM_MISSING' 2>/dev/null || true
              docker exec android sh -c 'echo "=== emu.log tail ==="; find / -name emu.log -mmin -15 2>/dev/null | head -1 | xargs -r tail -n 80' 2>/dev/null || true
              docker exec android sh -c 'echo "=== docker-android logs ==="; find /home/androidusr /opt -name "*.log" 2>/dev/null | while read f; do echo "### $f"; tail -n 30 "$f"; done' 2>/dev/null || true
              docker exec android sh -c 'echo "=== adb logcat (boot errors) ==="; adb logcat -d -t 30 2>/dev/null | tail -n 30' 2>/dev/null || true
              docker exec android sh -c 'echo "=== qemu ps ==="; ps aux 2>/dev/null | grep -E "qemu|emulator" | head -n 5' 2>/dev/null || true
              docker exec android supervisorctl status 2>/dev/null || echo "supervisord not responding (socket missing)"
              docker logs android --tail 200 || true
              docker exec android adb kill-server 2>/dev/null || true
              docker exec android adb start-server 2>/dev/null || true
              docker exec android adb wait-for-device 2>/dev/null || true
              docker exec android adb shell "setprop ctl.stop bootanim" 2>/dev/null || true
              docker exec android adb shell input keyevent 82 2>/dev/null || true
              docker exec android adb shell wm dismiss-keyguard 2>/dev/null || true
              sleep 15
            fi
            if [ "$STATUS" = "1" ]; then
              echo "✅ Android booted after ~$((i*10))s"
              # Unlock and disable animations that cause freeze on next boot
              docker exec android adb shell input keyevent 82 || true
              docker exec android adb shell svc power stayon true || true
              docker exec android adb shell settings put global window_animation_scale 0 || true
              docker exec android adb shell settings put global transition_animation_scale 0 || true
              break
            fi
            # If container died or no qemu process (emulator crashed), restart container (max 2 times)
            if { ! docker ps | grep -q android || { [ "$i" -ge 5 ] && [ "$HAS_QEMU" = "QEMU_NO" ]; } ; } && [ "$RESTARTED" -lt 2 ]; then
              RESTARTED=$((RESTARTED+1))
              echo "❌ Emulator down (no qemu process) — restarting container ($RESTARTED/2)..."
              docker logs android --tail 100 || true
              docker rm -f android 2>/dev/null || true
              docker run -d --name android --device /dev/kvm --privileged --shm-size=2g -p 6080:6080 -p 5554:5554 -p 5555:5555 -e EMULATOR_DEVICE="Pixel 8" -e EMULATOR_PLATFORM_VERSION=14.0 -e WEB_VNC=true -e EMULATOR_NO_SKIN=true -e SCREEN_WIDTH=1080 -e SCREEN_HEIGHT=2400 -e SCREEN_DEPTH=24 -e EMULATOR_ARGS="-no-audio -no-boot-anim -no-metrics -memory 2048 -cores 2 -no-snapshot" -e WEB_LOG=true budtmo/docker-android:emulator_14.0
              sleep 30
            fi
            sleep 10
          done
          # Final check
          STATUS=$(docker exec android adb shell getprop sys.boot_completed 2>/dev/null || echo "0")
          if [ "$STATUS" != "1" ]; then
            echo "❌ Still not booted, dumping logs for debug"
            docker logs android --tail 200 || true
            docker exec android adb shell getprop || true
            # Don't fail yet, try to continue — Cloudflared may still work with frozen screen, but we warn
          fi
          docker exec android adb shell getprop ro.build.version.release || true
          docker exec android adb devices || true
          docker exec android adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | head -n 5 || true

      - name: Setup streamer (static ffmpeg + websockets via pip, as root)
        run: |
          cat > setup_stream.sh <<'BASH'
          #!/bin/bash
          set -e
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "downloading static ffmpeg..."
            python3 - >/dev/null 2>&1 <<'PY'
          import urllib.request, tarfile, shutil, glob, os
          url='https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz'
          req=urllib.request.Request(url, headers={'User-Agent':'x'})
          data=urllib.request.urlopen(req, timeout=240).read()
          open('/tmp/ff.tar.xz','wb').write(data)
          t=tarfile.open('/tmp/ff.tar.xz'); t.extractall('/tmp'); t.close()
          p=glob.glob('/tmp/ffmpeg-*-static/ffmpeg')[0]
          shutil.copy(p, '/usr/local/bin/ffmpeg'); os.chmod('/usr/local/bin/ffmpeg', 0o755)
          print('ffmpeg installed at /usr/local/bin/ffmpeg')
          PY
          fi
          ffmpeg -version 2>&1 | head -1
          mkdir -p /opt/ws
          python3 -m pip -q install --no-input --target /opt/ws websockets 2>/tmp/pip.err || python3 -m pip -q install --no-input --break-system-packages --target /opt/ws websockets 2>>/tmp/pip.err
          tail -2 /tmp/pip.err || true
          PYTHONPATH=/opt/ws python3 -c "import websockets;print('websockets', websockets.__version__)"
          BASH
          docker cp setup_stream.sh android:/tmp/setup_stream.sh
          docker exec -u 0 android bash /tmp/setup_stream.sh'

      - name: Start H.264 stream server (WS video 9010 + WS input 9011)
        run: |
          echo "" | base64 -d > stream_server.py
          docker cp stream_server.py android:/tmp/stream_server.py
          docker exec -d -e DISPLAY=:0 -e PYTHONPATH=/opt/ws -e FFMPEG=/usr/local/bin/ffmpeg android python3 /tmp/stream_server.py
          sleep 12
          docker exec android sh -c "cat /tmp/stream_server.log 2>/dev/null; echo ---; cat /tmp/stream_geo 2>/dev/null || echo GEOM_PENDING"
          docker exec android ps aux | grep -E 'ffmpeg|stream_server' | head -5 || true

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Start Cloudflared tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate --edge-ip-version auto --protocol http2 --logfile cloudflared.log --loglevel info &
          nohup cloudflared tunnel --url http://localhost:9010 --no-autoupdate --edge-ip-version auto --protocol http2 --logfile cf-stream.log --loglevel info &
          nohup cloudflared tunnel --url http://localhost:9011 --no-autoupdate --edge-ip-version auto --protocol http2 --logfile cf-control.log --loglevel info &
          echo $! > cloudflared.pid
          sleep 25
          echo "=== vnc ==="; grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 || true
          echo "=== stream ==="; grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cf-stream.log | head -1 || true
          echo "=== control ==="; grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cf-control.log | head -1 || true

      - name: Get tunnel URL + commit android-link.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          geturl() { grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$1" | head -1; }
          URL=""; SURL=""; CURL=""
          for i in $(seq 1 90); do
            URL=$(geturl cloudflared.log); SURL=$(geturl cf-stream.log); CURL=$(geturl cf-control.log)
            if [ -n "$URL" ] && [ -n "$SURL" ] && [ -n "$CURL" ]; then break; fi
            echo "⏳ Waiting for Cloudflared URLs (vnc/stream/control)... ($i/90) ${URL:+vnc=OK} ${SURL:+stream=OK} ${CURL:+control=OK}"
            sleep 5
          done

          if [ -z "$URL" ] || [ -z "$SURL" ] || [ -z "$CURL" ]; then
            echo "TUNNEL_FAILED: no trycloudflare URL after 5 minutes" > android-link.txt
          else
            FULL="$URL/vnc.html?autoconnect=true&resize=scale"
            {
              echo '======================================================='
              echo 'CLOUD ANDROID - DucThang x TrueHieu Edition'
              echo '======================================================='
              echo "VNC_URL   : $FULL"
              echo "STREAM_URL: $SURL"
              echo "CTRL_URL  : $CURL"
              echo "Device    : Pixel 8 (Android 14, x86_64)"
              echo "Config    : 4GB RAM / 4 cores / KVM / SwiftShader"
              echo "ADB       : docker exec android adb ..."
              echo "Host      : trycloudflare"
              echo "Created   : $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
              echo '======================================================='
            } > android-link.txt
            echo "✅ VNC: $FULL"
            echo "✅ STREAM: $SURL"
            echo "✅ CTRL: $CURL"
          fi
          git config user.email "fcp@freecloudphone.com"
          git config user.name "FREE CLOUD PHONE"
          git add android-link.txt
          git commit -m "Update Cloud Android link" --allow-empty
          git push origin main --force-with-lease

      - name: Keep session alive (~5h45m)
        run: |
          echo "Keeping Android alive until cron restart..."
          sleep 20700
          kill $(cat cloudflared.pid) 2>/dev/null || true
          docker stop android 2>/dev/null || true
          echo "Session ended."
